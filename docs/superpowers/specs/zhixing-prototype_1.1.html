10px;background:#fff;color:var(--ink);max-width:100%}textarea{min-height:95px;resize:vertical;width:100%}main{max-width:1360px;margin:auto;padding:32px 38px}.eyebrow{color:var(--green);font-size:11px;letter-spacing:2px;font-weight:bold}h1{font-size:29px;margin:8px 0 10px;letter-spacing:-.7px}h2{font-size:18px;margin:0 0 16px}h3{font-size:15px;margin:0 0 10px}p{line-height:1.8}.muted{color:var(--muted)}.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px;gap:15px}.heading p{margin:0;color:var(--muted)}.banner{background:#edf3ee;border:1px solid #dbe7de;padding:12px 17px;border-radius:8px;color:#526d5e;font-size:12px;margin-bottom:25px;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.two{display:grid;grid-template-columns:1.6fr 1fr;gap:22px}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:24px;margin-bottom:20px}.stat{font-size:30px;font-weight:700;margin:15px 0 8px}.tag{display:inline-block;font-size:11px;border-radius:5px;padding:5px 9px;background:var(--mint);color:var(--green)}.tag.orange{background:#fff1df;color:var(--orange)}.tag.gray{background:#f0f2f3;color:#748185}.row{display:flex;align-items:center;justify-content:space-between;gap:15px}.listrow{padding:18px 0;border-bottom:1px solid #eef1ef}.listrow:last-child{border:0}.actions{display:flex;gap:9px;flex-wrap:wrap}.progress{height:6px;border-radius:5px;background:#eaf0ec;margin:12px 0;overflow:hidden}.progress b{height:100%;display:block;background:var(--green)}table{width:100%;border-collapse:collapse;text-align:left}th{font-size:12px;color:var(--muted);font-weight:500;background:#f7f9f7}td,th{padding:15px 12px;border-bottom:1px solid #eef1ef}td small{display:block;margin-top:5px;color:var(--muted)}label.field{display:block;margin-bottom:18px;line-height:2}label.field input,label.field select{display:block;width:100%;margin-top:5px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}.hero{background:#183f36;color:white;position:relative;overflow:hidden}.hero p{color:#bdd2c5}.hero:after{content:'↗';position:absolute;right:25px;top:-25px;font-size:190px;opacity:.08}.steps{counter-reset:s}.step{position:relative;padding:2px 0 23px 45px;border-left:1px solid #d7e4dc;margin-left:15px}.step:before{counter-increment:s;content:counter(s);position:absolute;left:-15px;top:0;width:29px;height:29px;border-radius:50%;background:var(--mint);border:1px solid #bad6c7;color:var(--green);display:grid;place-items:center}.empty{text-align:center;padding:40px;color:var(--muted)}.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#183f36;color:white;border-radius:9px;padding:15px 24px;z-index:20;box-shadow:0 5px 25px #0002}.hidden{display:none}.choice{display:block;padding:15px;border:1px solid var(--line);border-radius:8px;margin:10px 0;cursor:pointer}.choice:has(input:checked){background:var(--mint);border-color:var(--green)}.choice input{margin-right:10px}.result{background:#eff6f1;border-left:3px solid var(--green);padding:18px;margin:16px 0}.login{max-width:980px;margin:55px auto;padding:30px}.login .card{padding:32px}.login .grid{margin-top:30px}.login button{width:100%;margin-top:20px}.footnote{font-size:12px;line-height:1.8;color:var(--muted);margin-top:20px}.number{font-size:11px;color:var(--muted);letter-spacing:1px}.reading{line-height:2;font-size:15px}.reading pre{background:#f3f6f3;padding:20px;overflow:auto;font-family:monospace}.success{font-size:42px;color:var(--green)}@media(max-width:900px){aside{width:180px;padding:25px 10px}.layout{grid-template-columns:180px 1fr}main{padding:24px 20px}.top{padding:0 20px}.grid{grid-template-columns:1fr}.two{grid-template-columns:1fr}.card{padding:20px}.heading{align-items:flex-start}.formgrid{grid-template-columns:1fr}}@media(max-width:580px){aside{position:static;width:auto;height:auto;padding:15px}.layout{display:block}.brand{padding:0 0 10px}.sidefoot,.label{display:none}nav{display:flex;flex-wrap:wrap}nav a{font-size:12px;padding:8px}nav a i{display:none}.top{height:auto;padding:12px;gap:10px;flex-wrap:wrap}.heading{display:block}.heading .actions{margin-top:15px}h1{font-size:24px}table{font-size:12px}td,th{padding:9px 5px}.role select{max-width:145px}.login{margin:10px auto;padding:20px}}
</style></head><body><div id="app"></div><div id="toast" class="toast hidden" role="status"></div><script>
'use strict';
const KEY='zhixing-prototype-v1';
const seed=()=>({version:1,role:'student',user:'张三',joined:true,goal:'掌握 Python 函数与递归',hours:5,diagnosed:false,path:false,replan:'none',minutes:0,read:false,readings:{},attempt:null,resources:[{id:'r1',title:'Python 函数与递归入门',type:'课程讲义',description:'从函数调用到递归边界，用一个阶乘例子建立完整理解。',published:true}],tasks:[{id:'t1',title:'函数与递归 · 基础练习',description:'阅读课程讲义，完成一道递归边界判断题。',due:'2026-11-04',published:true}],submissions:[],accounts:[{name:'陈老师',role:'教师',active:true},{name:'张三',role:'学生',active:true},{name:'李四',role:'学生',active:true}],events:[]});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||seed();if(db.version!==1)db=seed()}catch{db=seed()}
let storageOK=true;function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch{storageOK=false;toast('浏览器存储不可用，当前更改不能在刷新后保留');return false}}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names={student:'学生端',teacher:'教师端',admin:'管理员端'};const navs={student:[['home','学习概览','◫'],['goal','目标与诊断','◎'],['path','我的学习路径','⌁'],['resources','课程资源','▤'],['tasks','任务与反馈','✓'],['records','学习记录','◷']],teacher:[['classes','班级总览','◫'],['students','学生详情','♙'],['publish','资源发布','▤'],['assign','任务管理','▦'],['progress','班级进度','↗']],admin:[['accounts','账号管理','♙'],['settings','模型配置示意','⚙']]};
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.add('hidden'),3500)}
function go(p){history.pushState(null,'','#'+p);render();window.scrollTo(0,0)}function event(s){db.events.unshift({text:s,time:new Date().toLocaleString('zh-CN')});db.events=db.events.slice(0,60)}
function switchRole(r){kbResults=null;kbDetail=null;db.role=r;db.user=r==='teacher'?'陈老师':r==='admin'?'管理员':'张三';save();go(navs[r][0][0]);render()}
const btn=(text,action,primary=false)=>`<button ${primary?'class="primary"':''} onclick="${action}">${text}</button>`;
const tag=(s,c='')=>`<span class="tag ${c}">${s}</span>`;const card=(s)=>`<section class="card">${s}</section>`;
function title(k,t,p,action=''){return `<div class="heading"><div><div class="eyebrow">${k}</div><h1>${t}</h1><p>${p}</p></div><div class="actions">${action}</div></div>`}
function stats(a){return `<div class="grid">${a.map(([l,v,n])=>card(`<div class="muted">${l}</div><div class="stat">${v}</div><small class="muted">${n}</small>`)).join('')}</div>`}
function render(){let p=location.hash.slice(1)||navs[db.role][0][0];if(p==='login'){login();return}const allowed=(p==='kbdetail'&&['student','teacher'].includes(db.role))||navs[db.role].some(n=>n[0]===p)||(db.role==='student'&&['read','quiz','replan'].includes(p))||(db.role==='teacher'&&['success','read'].includes(p));if(!allowed){p=navs[db.role][0][0];history.replaceState(null,'','#'+p)}document.getElementById('app').innerHTML=`<div class="layout"><aside><div class="brand"><span>知</span>知行</div><div class="label">LEARNING WORKSPACE</div><nav>${navs[db.role].map(([id,n,i])=>`<a class="${p===id?'active':''}" href="#${id}"><i>${i}</i>${n}</a>`).join('')}</nav><div class="sidefoot">第 2 周 · 交互原型<br>把每一步学习，变成进步。<br><a href="#login">角色选择页 →</a></div></aside><div class="main"><header class="top"><div><b>智能学习规划助手</b><br><small>卓越工程实践 / ${names[db.role]}</small></div><div class="role"><span class="avatar">${db.user.slice(0,1)}</span><span>${esc(db.user)}</span><select aria-label="切换演示身份" onchange="switchRole(this.value)">${Object.entries(names).map(([v,n])=>`<option value="${v}" ${v===db.role?'selected':''}>${n} · 演示切换</option>`).join('')}</select></div></header><main><div class="banner">交互原型 · 所有人物与数据均为示例。操作仅保存在当前浏览器；身份切换、评分和 AI 结果用于展示流程，不代表真实鉴权或模型服务。${!storageOK?' <b>当前浏览器存储不可用。</b>':''}</div>${pages[p]()}<div class="footnote row"><span>知行 / WEEK 02 PROTOTYPE<br>刷新恢复适用于同一浏览器、同一网址；跨设备不共享数据。</span><div class="actions"><a href="index.html" download="zhixing-prototype.html" style="padding:10px">下载单文件源码</a>${btn('演示指南',"guide()")}${btn('重置示例数据',"resetDemo()")}</div></div></main></div></div>`}
function login(){document.getElementById('app').innerHTML=`<div class="login"><div class="eyebrow">ZHIXING / WEEK 02</div><h1>让学习有方向，让进步看得见。</h1><p class="muted">智能学习规划助手 · 选择一个身份，开始演示。</p><div class="grid">${[['student','学生','设置目标，沿着路径学习，记录每一次进步。'],['teacher','教师','发布课程资源与任务，了解班级学习情况。'],['admin','管理员','维护演示账号，查看模型配置设计。']].map(([r,n,d])=>card(`<div class="number">${names[r]}</div><h2 style="margin-top:18px">${n}工作台</h2><p class="muted">${d}</p>${btn('以'+n+'身份进入',`switchRole('${r}')`,true)}`)).join('')}</div><p class="footnote">无需密码。这里是前端身份切换演示，没有真实账号认证。所有数据为结构示意。</p></div>`}
const pages={};
pages.home=()=>title('MY LEARNING','张三，今天也向前一步。','在一个清晰的计划里，完成今天的小目标。',btn('设置学习目标',"go('goal')",true))+stats([['本周已记录',db.minutes+' 分钟','主动填写的阅读时长'],['已完成任务',db.tasks.filter(t=>t.published&&db.submissions.includes(t.id)).length+' / '+db.tasks.filter(t=>t.published).length,'当前示例账号的提交情况'],['当前学习目标',db.path?'已生成路径':'待规划',db.goal]])+`<div class="two"><div>${card(`<div class="row"><h2>今天，从这里开始</h2>${tag('Python 基础')}</div><div class="listrow row"><div><h3>01　阅读函数与递归讲义</h3><span class="muted">建议 10 分钟 · ${db.read?'已记录阅读':'尚未记录'}</span></div>${btn('开始阅读',"go('resources')",true)}</div><div class="listrow row"><div><h3>02　完成课堂基础练习</h3><span class="muted">提交后查看正确答案与解析</span></div>${btn('查看任务',"go('tasks')")}</div><div class="listrow row"><div><h3>03　查看学习路径</h3><span class="muted">诊断 → 学习 → 验证 → 调整</span></div>${btn('我的路径',"go('path')")}</div>`)}</div><div>${card(`<div class="eyebrow">LEARNING FOCUS</div><h2 style="margin-top:15px">${esc(db.goal)}</h2><p class="muted">每周投入 ${db.hours} 小时<br>课程关联：Python 程序设计 · 01 班</p><div class="progress"><b style="width:${db.attempt?66:db.read?33:0}%"></b></div><small class="muted">示例学习阶段进度，非真实掌握度</small>`)}</div></div>`;
pages.goal=()=>title('GOAL & DIAGNOSIS','从一个明确的目标开始','填写目标，再用一道示例题了解起点。')+`<div class="two">${card(`<h2>我的学习目标</h2><form onsubmit="setGoal(event)"><label class="field">想学会什么？<input name="goal" required maxlength="100" value="${esc(db.goal)}"></label><div class="formgrid"><label class="field">每周可用时间（小时）<input name="hours" type="number" min="1" max="40" required value="${db.hours}"></label><label class="field">关联课程<select><option>Python 程序设计 · 01 班</option></select></label></div><button class="primary">保存目标并开始诊断</button></form>${db.diagnosed?`<div class="result">目标已保存。请判断：递归函数必须包含什么？<form onsubmit="diagnose(event)"><label class="choice"><input type="radio" name="answer" value="a" required>一个明确的结束条件</label><label class="choice"><input type="radio" name="answer" value="b">无限调用自身</label><button class="primary">提交诊断并生成示例路径</button></form></div>`:''}`)}${card('<h2>这一步会发生什么？</h2><div class="steps"><div class="step"><h3>确认目标</h3><p class="muted">保存你的学习方向与时间预算。</p></div><div class="step"><h3>了解基础</h3><p class="muted">通过示例题展示诊断交互。</p></div><div class="step"><h3>生成路径</h3><p class="muted">展示函数 → 递归 → 综合应用的预设路径。没有调用真实 AI。</p></div></div>')}</div>`;
pages.path=()=>title('LEARNING PATH','每一步，都有来由','按先修关系逐步学习；路径内容是预设的结构示意。',btn('调整目标',"go('goal')"))+(db.path?`<div class="two">${card(`<div class="row"><h2>${esc(db.goal)}</h2>${tag(db.replan==='accepted'?'路径 v2':'路径 v1')}</div><div class="steps">${(db.replan==='accepted'?['函数基础','递归边界补强','递归与调用栈','综合练习']:['函数基础','递归与调用栈','综合练习']).map((n,i)=>`<div class="step"><div class="row"><h3>${n}</h3>${tag(i===0&&db.read?'已阅读':i===0?'当前阶段':'后续阶段',i?'gray':'')}</div><p class="muted">${i===0?'先理解参数、返回值与函数调用。':'在前序基础上完成例题与自测。'} · 预计 ${i===0?30:n==='递归边界补强'?15:45} 分钟</p>${i===0?btn('阅读关联资源',"go('resources')",true):''}</div>`).join('')}</div>`)}${card(`<h2>路径说明</h2><p>先掌握函数调用，再理解递归终止条件，最后完成综合应用。</p><p class="muted">引用：本原型内置课程讲义<br>预算：每周 ${db.hours} 小时<br>校验：先修顺序示意</p>${db.attempt===0?`<div class="result">本次练习未达标，建议先补强递归边界。</div>${btn('查看重规划建议',"go('replan')",true)}`:btn('去完成一次练习',"go('tasks')")}`)}</div>`:card(`<div class="empty"><h2>还没有学习路径</h2><p>完成目标设置与示例诊断后，路径会显示在这里。</p>${btn('设置目标与诊断',"go('goal')",true)}</div>`));
pages.resources=()=>title('COURSE LIBRARY','课程资源','Python 程序设计 · 01 班',db.joined?tag('已加入班级'):btn('输入邀请码加入',"joinClass()",true))+(db.joined?`<div class="grid">${db.resources.filter(r=>r.published).map(r=>card(`<div class="row"><span class="eyebrow">COURSE NOTES</span>${tag(r.type)}</div><h2 style="margin-top:24px">${esc(r.title)}</h2><p class="muted">${esc(r.description)}</p><div class="listrow row"><span class="muted">陈老师 · 班级可见</span>${tag((db.readings||{})[r.id]?'已记录阅读':'待阅读',(db.readings||{})[r.id]?'':'gray')}</div>${btn('打开阅读',`openResource('${r.id}')`,true)}`)).join('')||card('<div class="empty">暂无已发布资源，请切换教师端发布。</div>')}</div>`:card('<div class="empty">加入班级后查看课程资源。演示邀请码：PY2026</div>'));
let currentResource=db.currentResource||'r1';function openResource(id){currentResource=id;db.currentResource=id;save();go('read')}
pages.read=()=>{const r=db.resources.find(r=>r.id===currentResource&&r.published);if(!r)return card('该资源已下架或不存在。');return title('READ & RECORD',esc(r.title),'课程讲义 · 本地示例内容',btn('返回资源列表',"go('resources')"))+`<div class="two">${card(`<article class="reading"><div class="eyebrow">01 / FOUNDATIONS</div><h2 style="margin-top:20px">理解函数与递归</h2><p>${esc(r.description)}</p><h3>函数：封装一个可以重复使用的步骤</h3><p>函数通过参数接收输入，并通过返回值给出结果。将复杂问题拆成独立步骤，有助于阅读、测试和复用代码。</p><h3>递归：把问题交给更小的自己</h3><p>递归函数需要一个明确的结束条件。如果没有终止分支，函数将持续调用自身，无法正常返回。</p><pre>def factorial(n):\n    if n &lt;= 1:\n        return 1\n    return n * factorial(n - 1)</pre><p>在这个例子中，n ≤ 1 是结束条件，factorial(n - 1) 将问题规模缩小。</p><div class="result">思考：如果删除结束条件，这段程序会发生什么？</div></article>`)}${card(`<h2>记录本次学习</h2><p class="muted">主动填写实际阅读时长。重复点击保存会更新本次记录，不会重复累加。</p><form onsubmit="recordReading(event)"><label class="field">本次阅读时长（分钟）<input type="number" name="minutes" min="1" max="240" required value="${(db.readings||{})[currentResource]||10}"></label><button class="primary">保存阅读记录</button></form>${(db.readings||{})[currentResource]?`<div class="result">已保存 ${db.readings[currentResource]} 分钟<br>刷新后可在学习记录中查看。</div>`:''}<div style="margin-top:20px">${btn('继续完成练习',"go('tasks')")}</div>`)}</div>`};

function setGoal(e){e.preventDefault();const f=new FormData(e.target);db.goal=f.get('goal').trim();if(!db.goal)return toast('请输入目标');db.hours=Number(f.get('hours'));db.diagnosed=true;db.path=false;db.replan='none';event('保存学习目标：'+db.goal);save();render();toast('目标已保存，请完成下方示例诊断')}
function diagnose(e){e.preventDefault();db.path=true;event('完成示例诊断并生成预设路径');save();go('path');toast('示例路径已生成（未调用 AI）')}
function recordReading(e){e.preventDefault();db.readings=db.readings||{};db.readings[currentResource]=Number(new FormData(e.target).get('minutes'));db.minutes=Object.values(db.readings).reduce((a,b)=>a+b,0);db.read=true;event('保存阅读时长：'+db.readings[currentResource]+' 分钟');const ok=save();render();if(ok)toast('已保存，可刷新页面验证')}
function submitQuiz(e){e.preventDefault();if(db.submissions.includes(currentTask))return;const score=new FormData(e.target).get('answer')==='a'?100:0;db.submissions.push(currentTask);db.scores=db.scores||{};db.scores[currentTask]=score;db.answers=db.answers||{};db.answers[currentTask]=new FormData(e.target).get('answer');db.attempt=score;if(score===0)db.replan='pending';event('提交课堂练习：'+score+' 分');save();render();toast('提交完成，反馈已生成')}
function applyReplan(yes){db.replan=yes?'accepted':'rejected';if(yes)db.path=true;event(yes?'接受示例重规划，新增递归补强任务':'拒绝示例重规划，保留原路径');save();go('path');toast(yes?'已更新为示例路径 v2':'已保留原路径')}
function publishResource(e){e.preventDefault();const f=new FormData(e.target);if(!f.get('title').trim()||!f.get('description').trim())return toast('请填写标题和说明');db.resources.unshift({id:'r'+Date.now(),title:f.get('title').trim(),description:f.get('description').trim(),type:f.get('type'),published:true});event('教师发布资源：'+f.get('title'));save();go('success')}
function toggleResource(id){const r=db.resources.find(r=>r.id===id);r.published=!r.published;event((r.published?'发布':'下架')+'资源：'+r.title);save();render();toast('资源状态已更新')}
function publishTask(e){e.preventDefault();const f=new FormData(e.target);if(!f.get('title').trim()||!f.get('description').trim())return toast('请填写名称和说明');db.tasks.unshift({id:'t'+Date.now(),title:f.get('title').trim(),description:f.get('description').trim(),due:f.get('due'),published:true});event('教师发布任务：'+f.get('title'));save();go('success')}
function withdrawTask(id){if(!confirm('撤回后学生列表不再显示此任务，历史提交仍保留。继续？'))return;db.tasks.find(t=>t.id===id).published=false;event('撤回任务');save();render()}
function addAccount(e){e.preventDefault();const f=new FormData(e.target),name=f.get('name').trim();if(!name)return;if(db.accounts.some(a=>a.name===name))return toast('该姓名已存在，请使用不同示例姓名');db.accounts.push({name,role:f.get('role'),active:true});event('创建示例账号：'+name);save();render();toast('示例账号已创建')}

let kbQuery='',kbType='all',kbResults=null,kbDetail=null,kbObjectUrl=null;
const kbFormats={txt:'文档',md:'文档',pdf:'文档',docx:'文档',pptx:'课件',mp4:'视频',webm:'视频',mov:'视频',mp3:'音频',wav:'音频',m4a:'音频',png:'图片',jpg:'图片',jpeg:'图片',srt:'字幕',vtt:'字幕'};
function kbOpenDB(){return new Promise((resolve,reject)=>{const q=indexedDB.open('zhixing-course-files',1);q.onupgradeneeded=()=>q.result.createObjectStore('files');q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
async function kbFile(method,id,value){const conn=await kbOpenDB();return new Promise((resolve,reject)=>{const tx=conn.transaction('files',method==='get'?'readonly':'readwrite');const s=tx.objectStore('files');const req=method==='put'?s.put(value,id):method==='clear'?s.clear():s.get(id);let result;req.onsuccess=()=>result=req.result;tx.oncomplete=()=>{conn.close();resolve(result)};tx.onerror=()=>{conn.close();reject(tx.error)}})}
function kbVisible(){return db.resources.filter(r=>db.role==='teacher'||r.published)}
function kbStatus(r){return r.kbState||'内置示例'}
function kbList(teacher=false){const items=kbVisible().filter(r=>kbType==='all'||(r.kind||'文档')===kbType);return `<div class="row" style="margin-bottom:18px"><h2>资料目录</h2><select aria-label="按格式筛选" onchange="kbType=this.value;render()">${['all','文档','课件','视频','音频','图片','字幕','网址'].map(t=>`<option value="${t}" ${t===kbType?'selected':''}>${t==='all'?'全部格式':t}</option>`).join('')}</select></div>${items.length?items.map(r=>`<div class="listrow"><div class="row"><div><h3>${esc(r.title)}</h3><small class="muted">${esc(r.kind||'文档')} · ${esc(r.course||'Python 程序设计 · 01 班')} ${r.filename?' · '+esc(r.filename):''}</small></div>${tag(r.published?'已发布':'待发布',r.published?'':'gray')}</div><p class="muted">${esc(r.description)}<br>${esc(kbStatus(r))}${r.bytes?' · '+(r.bytes/1024/1024).toFixed(2)+' MB':''}</p><div class="actions">${r.kb?btn('查看资料',`showKb('${r.id}')`):btn('打开示例讲义',`openResource('${r.id}')`)}${teacher?btn(r.published?'下架':'发布给学生',`toggleResource('${r.id}')`):''}</div></div>`).join(''):'<div class="empty">当前分类没有资料。教师可上传后发布。</div>'}`}
pages.publish=()=>title('COURSE KNOWLEDGE BASE','课程知识库','教师统一上传、整理和发布课程资料。',btn('检索本地资料',"go('search')"))+`<div class="banner">本原型实际把文件保存在本浏览器 IndexedDB，不上传服务器。TXT/MD/SRT/VTT 可读取文本；视频可播放，PDF、Office、图片与音频尚未执行正文解析、OCR 或自动转写。</div><div class="two">${card(`<h2>上传课程资料</h2><form onsubmit="uploadKb(event)"><label class="field">课程资料文件（可多选）<input name="files" type="file" multiple required accept=".txt,.md,.pdf,.docx,.pptx,.mp4,.webm,.mov,.mp3,.wav,.m4a,.png,.jpg,.jpeg,.srt,.vtt"></label><p class="footnote">文档/图片/字幕每份 ≤ 10 MB，视频/音频 ≤ 100 MB；文本解析 ≤ 1 MB。浏览器空间不足时会明确提示失败。旧版 DOC/PPT 暂请转换为 DOCX/PPTX。</p><label class="field">标题前缀（可选）<input name="prefix" maxlength="60" placeholder="例如：第三章 · 递归"></label><label class="field">知识点标签<input name="tags" required maxlength="150" placeholder="例如：Python，递归，结束条件"></label><label class="field">资料说明<textarea name="description" required maxlength="500" placeholder="介绍适用章节和学习目标"></textarea></label><label class="field">课程 / 可见范围<select name="course"><option>Python 程序设计 · 01 班</option></select></label><label class="choice"><input name="publish" type="checkbox">上传成功后发布给本班学生</label><button class="primary" id="kbUploadButton">保存课程资料</button><p id="kbUploadStatus" role="status" class="muted"></p></form>`)}${card(kbList(true))}</div>`;
pages.resources=()=>title('COURSE LIBRARY','课程知识库','浏览教师已发布的文档、视频、课件与其他资料。',btn('搜索资料 / 查找缺失内容',"go('search')",true))+card(kbList(false));
async function uploadKb(e){e.preventDefault();if(db.role!=='teacher')return toast('请在教师端上传课程资料');const f=new FormData(e.target),files=f.getAll('files').filter(x=>x.size>0);if(!files.length)return toast('请选择非空文件');if(!f.get('tags').trim()||!f.get('description').trim())return toast('请填写标签和资料说明');const b=document.getElementById('kbUploadButton');b.disabled=true;let ok=0,errors=[];for(const file of files){const ext=file.name.split('.').pop().toLowerCase(),kind=kbFormats[ext];if(!kind){errors.push(file.name+'：不支持此格式');continue}const limit=['视频','音频'].includes(kind)?100:10;if(file.size>limit*1024*1024){errors.push(file.name+'：超过 '+limit+' MB');continue}try{const id='kb'+(Date.now().toString(36)+'-'+Array.from(crypto.getRandomValues(new Uint32Array(2))).join('-'));let text='',state='文件已保存 · 正文待解析';if(['txt','md','srt','vtt'].includes(ext)&&file.size<=1024*1024){text=await file.text();state='文本已读取 · 可关键词检索'}else if(kind==='视频'||kind==='音频')state='文件已保存 · 待添加字幕/转写';else if(kind==='图片')state='文件已保存 · 待 OCR';await kbFile('put',id,file);const r={id,kb:true,title:(f.get('prefix').trim()?f.get('prefix').trim()+' · ':'')+file.name,filename:file.name,ext,kind,bytes:file.size,description:f.get('description').trim(),tags:f.get('tags').trim(),course:f.get('course'),published:f.has('publish'),text,kbState:state,uploadedAt:new Date().toISOString()};db.resources.unshift(r);if(!save()){db.resources.shift();throw Error('目录保存失败，文件未发布')}ok++;}catch(err){errors.push(file.name+'：保存失败（'+(err.name||'未知错误')+'），请检查浏览器空间/权限后重试')}}event('教师导入课程资料：'+ok+' 份');save();render();const msg=document.getElementById('kbUploadStatus');if(msg)msg.textContent='已保存 '+ok+' 份。'+errors.join('；');toast('课程资料已保存 '+ok+' 份'+(errors.length?'，部分文件失败，请查看提示':''))}
async function showKb(id){const r=db.resources.find(x=>x.id===id);if(!r||(!r.published&&db.role!=='teacher'))return toast('该资料未发布或已下架');if(kbObjectUrl){URL.revokeObjectURL(kbObjectUrl);kbObjectUrl=null}kbDetail=r;db.lastKb=id;save();let blob;try{if(!r.url)blob=await kbFile('get',id)}catch{}if(blob)kbObjectUrl=URL.createObjectURL(blob);go('kbdetail')}
function safeKbUrl(raw){try{const u=new URL(raw);if(u.protocol!=='https:'&&u.protocol!=='http:')return null;if(u.username||u.password)return null;return u.href}catch{return null}}
pages.kbdetail=()=>{const r=kbDetail;if(!r||(!r.published&&db.role!=='teacher'))return card('<div class="empty">请从课程知识库重新打开资料。</div>');const url=r.url&&safeKbUrl(r.url);let preview='';if(kbObjectUrl){if(r.kind==='视频')preview=`<video controls preload="metadata" src="${kbObjectUrl}" style="width:100%;max-height:420px;background:#132e28" onerror="document.getElementById('mediaError').textContent='当前浏览器不支持此编码，请下载后用本地播放器打开。'"></video><p id="mediaError" class="muted"></p>`;else if(r.kind==='音频')preview=`<audio controls src="${kbObjectUrl}" style="width:100%"></audio>`;else if(r.kind==='图片')preview=`<img src="${kbObjectUrl}" alt="${esc(r.title)}" style="max-width:100%;max-height:420px">`;else if(r.ext==='pdf')preview=`<p class="muted">PDF 可通过下方文件链接打开或下载；本原型未提取 PDF 正文。</p>`;preview+=`<p><a href="${kbObjectUrl}" download="${esc(r.filename)}">下载原始文件 ↓</a></p>`}else if(!url)preview='<div class="result">此浏览器未找到原文件，请由教师重新上传。元数据仍保留。</div>';if(url)preview=`<p><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">打开外部课程网址 ↗</a></p><p class="muted">${esc(url)}<br>仅保存网址，未抓取正文或验证内容质量。</p>`;return title('RESOURCE DETAIL',esc(r.title),'课程资料 · '+esc(r.kind),btn('返回知识库',`go('${db.role==='teacher'?'publish':'resources'}')`))+`<div class="two">${card(preview+(r.text?`<h2>可检索文本 / 字幕</h2><pre style="white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8;max-height:450px;overflow:auto">${esc(r.text)}</pre>`:'<p class="muted">暂无可检索正文。标题和标签命中不代表知识内容已覆盖。</p>'))}${card(`<h2>资料信息</h2><p>${esc(r.description)}</p><p class="muted">知识点：${esc(r.tags||'未填写')}<br>状态：${esc(kbStatus(r))}</p>${db.role==='teacher'&&['视频','音频'].includes(r.kind)?`<h3>补充字幕或转写文本</h3><form onsubmit="attachTranscript(event)"><label class="field">SRT / VTT / TXT 文件<input name="subtitle" type="file" accept=".srt,.vtt,.txt" required></label><button class="primary">读取并关联字幕</button></form><p class="footnote">实际读取人工提供的文本；没有自动语音识别。时间戳会保留在文本中，尚未做逐句跳转。</p>`:''}${db.role==='student'?`<form onsubmit="recordKbStudy(event)"><label class="field">学习时长（分钟）<input type="number" name="minutes" min="1" max="240" required value="${(db.readings||{})[r.id]||10}"></label><button class="primary">保存学习记录</button></form><p class="muted">当前资料已记录 ${(db.readings||{})[r.id]||0} 分钟；重复保存为更新。</p>`:''}`)}</div>`};
async function attachTranscript(e){e.preventDefault();if(db.role!=='teacher')return;const f=new FormData(e.target).get('subtitle');if(!f||!f.size||f.size>1024*1024||!['srt','vtt','txt'].includes(f.name.split('.').pop().toLowerCase()))return toast('请选择不超过 1 MB 的 SRT/VTT/TXT 文件');try{kbDetail.text=await f.text();kbDetail.transcriptName=f.name;kbDetail.kbState='字幕已关联 · 可关键词检索';if(save()){render();toast('字幕已关联并保存')}}catch{toast('字幕读取失败')}}
function recordKbStudy(e){e.preventDefault();const f=new FormData(e.target);db.readings=db.readings||{};db.readings[kbDetail.id]=Number(f.get('minutes'));db.minutes=Object.values(db.readings).reduce((a,b)=>a+b,0);db.read=true;event('学习课程资料：'+kbDetail.title+'，'+f.get('minutes')+' 分钟');save();render();toast('学习记录已保存')}
function searchKb(e){e.preventDefault();kbQuery=new FormData(e.target).get('query').trim();if(!kbQuery)return;const tokens=kbQuery.toLowerCase().split(/[\s,，、]+/).filter(Boolean);kbResults=kbVisible().map(r=>{const text=r.kb?r.text||'':r.description+' Python 函数 递归 结束条件';const meta=[r.title,r.description,r.tags||''].join(' ');return {r,body:tokens.some(t=>text.toLowerCase().includes(t)),meta:tokens.some(t=>meta.toLowerCase().includes(t))}}).filter(x=>x.body||x.meta);render()}
const webExamples=[{title:'Python 官方教程：控制流与函数定义',url:'https://docs.python.org/zh-cn/3/tutorial/controlflow.html',why:'可补充函数定义和控制流的基础阅读。',tokens:/python|函数|递归|控制流/i},{title:'Python 官方教程：数据结构',url:'https://docs.python.org/zh-cn/3/tutorial/datastructures.html',why:'可补充列表、栈、队列等基础阅读。',tokens:/python|列表|数据结构|队列|栈/i}];
pages.search=()=>{const n=kbResults?kbResults.filter(x=>x.body).length:0;return title('RETRIEVE & COMPLETE','先查知识库，再补充资料','本地关键词检索 → 判断资料缺口 → 查找外部网址。')+card(`<form onsubmit="searchKb(event)" class="actions"><input name="query" aria-label="知识点或问题" required value="${esc(kbQuery)}" placeholder="例如：递归 / Python 列表 / 动态规划" style="flex:1;min-width:200px"><button class="primary">检索课程知识库</button></form><p class="footnote">原型检索标题、标签、可读文本和字幕；不是语义 RAG 或完整知识覆盖判断。</p>`)+(kbResults===null?card('<div class="empty">输入知识点，优先查看教师已发布的课程资料。</div>'):card(`<div class="row"><h2>本地检索结果 · ${kbResults.length} 条</h2>${tag(n?'有文本命中，覆盖待确认':'资料不足 / 正文尚未就绪',n?'':'orange')}</div>${kbResults.map(({r,body})=>`<div class="listrow"><div class="row"><h3>${esc(r.title)}</h3>${tag(body?'文本关键词命中':'仅元数据命中',body?'':'orange')}</div><p class="muted">${esc(kbStatus(r))} · ${esc(r.kind||'文档')}</p>${btn('查看资料',r.kb?`showKb('${r.id}')`:`openResource('${r.id}')`)}</div>`).join('')||'<p class="muted">没有找到相关课程资料，不会虚构本地来源。</p>'}<div class="result">${n?'已有文本命中，但不能据此保证资料充分；如仍有疑问可继续联网查找。':'当前没有可检索的正文命中，请补充课程资料、关联字幕，或联网查找参考网址。'}</div><h2>联网补充与网址推荐</h2><p class="muted">原型未接搜索 API。下面按钮打开真实搜索引擎；推荐卡为预置的官方网址示例，不是本次实时搜索结果。私人材料不会自动发送，只有你填写的查询词会在点击后交给搜索引擎。</p><div class="actions"><a class="tag" style="padding:12px" href="https://www.bing.com/search?q=${encodeURIComponent(kbQuery+' 课程 教程')}" target="_blank" rel="noopener noreferrer">联网搜索「${esc(kbQuery)}」↗</a>${btn('教师如何补齐资料',"toast('教师端 → 课程知识库上传文件；视频可关联字幕。也可保存下方网址供后续审核。')")}</div>${webExamples.filter(x=>x.tokens.test(kbQuery)).map((x,i)=>`<div class="listrow"><div class="row"><h3>${esc(x.title)}</h3>${tag('预置官方网址示例','gray')}</div><p>${esc(x.why)}</p><p><a target="_blank" rel="noopener noreferrer" href="${x.url}">${x.url} ↗</a></p><small class="muted">网址于 2026-10-28 核对；页面内容可能更新。尚未导入知识库。</small></div>`).join('')||'<p class="muted">这个主题暂无预置推荐，不冒充实时推荐结果。请通过上方搜索入口寻找相关课程。</p>'}${db.role==='teacher'?`<h3 style="margin-top:25px">登记搜索发现的网址</h3><form onsubmit="saveKbUrl(event)"><label class="field">推荐标题<input name="title" required maxlength="100"></label><label class="field">网页地址<input name="url" type="url" required placeholder="https://..."></label><label class="field">推荐理由<input name="reason" required maxlength="300" placeholder="说明补充了哪个知识点"></label><button class="primary">保存为待审核资料</button></form><p class="footnote">只登记链接；教师可在知识库检查并发布。没有抓取网页正文，不作为已验证 RAG 证据。</p>`:'<p class="footnote">需要将外部网址纳入班级课程资料时，请由教师审核并登记发布。</p>'}`))};
function saveKbUrl(e){e.preventDefault();if(db.role!=='teacher')return;const f=new FormData(e.target),url=safeKbUrl(f.get('url'));if(!url)return toast('只支持不含用户名密码的 HTTP/HTTPS 网址');if(!f.get('title').trim()||!f.get('reason').trim())return toast('请填写标题与推荐理由');if(db.resources.some(r=>r.url===url))return toast('该网址已登记');db.resources.unshift({id:'kb'+(Date.now().toString(36)+'-'+Array.from(crypto.getRandomValues(new Uint32Array(2))).join('-')),kb:true,kind:'网址',title:f.get('title').trim(),url,description:f.get('reason').trim(),tags:kbQuery,course:'Python 程序设计 · 01 班',published:false,kbState:'链接已登记 · 待教师审核 · 正文未解析'});save();go('publish');toast('已保存待审核网址，尚未向学生发布')}
// Shared detail pages are allowed for teachers and students; actual authorization belongs to the future backend.
const oldGuide=guide;guide=function(){alert('知识库演示：\n1. 教师端 → 课程知识库 → 选择文件、填写标签说明 → 上传并发布。\n2. 上传视频后查看资料，可关联 SRT/VTT/TXT 字幕。\n3. 切换学生端 → 浏览资料、播放视频或下载文件，保存学习时长。\n4. 资料检索与补充 → 输入知识点，先查本地文本。\n5. 资料不足时打开真实搜索引擎，或查看标注的预置网址示例。\n6. 教师登记外部网址、审核后发布。\n\n文件仅保存本浏览器，没有服务器上传、自动转写或实时搜索 API。')};

window.addEventListener('hashchange',render);save();render();if(location.hash==='#kbdetail'&&db.lastKb)showKb(db.lastKb);
</script></body></html>
