<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080"><defs><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="#17642c"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="#cc630d"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#17251d} .small{font-size:18px} .title{font-size:42px;font-weight:700} .node{font-size:23px;font-weight:600} .sub{font-size:17px;fill:#4a5d50}</style><rect width="1800" height="1080" fill="white"/><text x="900" y="62" text-anchor="middle" class="title">学习反馈与重规划闭环</text><text x="900" y="102" text-anchor="middle" class="small">有效测验证据驱动掌握度；学习记录驱动执行调整；新方案确认后替换旧方案</text><rect x="25" y="140" width="1750" height="165" rx="18" fill="#f0f6f0"/><path d="M43 140 H155 V305 H43 Q25 305 25 287 V158 Q25 140 43 140" fill="#deedd8"/><text x="90" y="206.5" text-anchor="middle" class="node">用户</text><text x="90" y="238.5" text-anchor="middle" class="node">操作</text><rect x="25" y="330" width="1750" height="430" rx="18" fill="#f0f6f0"/><path d="M43 330 H155 V760 H43 Q25 760 25 742 V348 Q25 330 43 330" fill="#deedd8"/><text x="90" y="529.0" text-anchor="middle" class="node">系统</text><text x="90" y="561.0" text-anchor="middle" class="node">与智能体</text><rect x="25" y="785" width="1750" height="190" rx="18" fill="#f0f6f0"/><path d="M43 785 H155 V975 H43 Q25 975 25 957 V803 Q25 785 43 785" fill="#deedd8"/><text x="90" y="864.0" text-anchor="middle" class="node">数据</text><text x="90" y="896.0" text-anchor="middle" class="node">与历史</text><rect x="195" y="170" width="280" height="100" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="335.0" y="208.0" text-anchor="middle" class="node">① 学习、测验或重测</text><text x="335.0" y="246" text-anchor="middle" class="sub">路径任务 / 教师任务</text><rect x="650" y="170" width="280" height="100" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="790.0" y="208.0" text-anchor="middle" class="node">④ 主动生成重规划预览</text><text x="790.0" y="246" text-anchor="middle" class="sub">选择本地或云端</text><rect x="1360" y="170" width="340" height="100" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="1530.0" y="208.0" text-anchor="middle" class="node">⑧ 查看差异并决定</text><text x="1530.0" y="246" text-anchor="middle" class="sub">接受 / 拒绝</text><rect x="195" y="390" width="280" height="120" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="335.0" y="423.0" text-anchor="middle" class="node">② 更新有效证据</text><text x="335.0" y="453.0" text-anchor="middle" class="node">与执行记录</text><text x="335.0" y="486" text-anchor="middle" class="sub">学习分钟不直接增加掌握度</text><rect x="650" y="390" width="280" height="120" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="790.0" y="438.0" text-anchor="middle" class="node">⑤ 判定调整范围</text><text x="790.0" y="486" text-anchor="middle" class="sub">局部补强 / 全局重新安排</text><rect x="1035" y="390" width="280" height="120" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="1175.0" y="438.0" text-anchor="middle" class="node">⑥ 重新执行四智能体</text><text x="1175.0" y="486" text-anchor="middle" class="sub">诊断 → 构建 → 审查 → 解释</text><rect x="1360" y="390" width="340" height="120" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="1530.0" y="438.0" text-anchor="middle" class="node">⑨ 接受前再次校验</text><text x="1530.0" y="486" text-anchor="middle" class="sub">输入版本 / 权限 / 时间预算</text><rect x="650" y="610" width="280" height="100" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="790.0" y="648.0" text-anchor="middle" class="node">③ 对比活动路径依据</text><text x="790.0" y="686" text-anchor="middle" class="sub">提示测验或执行记录变化</text><rect x="1035" y="610" width="280" height="100" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="1175.0" y="648.0" text-anchor="middle" class="node">⑦ 保存候选与差异</text><text x="1175.0" y="686" text-anchor="middle" class="sub">新增 / 移除 / 保留 / 补强</text><rect x="1360" y="825" width="340" height="110" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="1530.0" y="868.0" text-anchor="middle" class="node">⑩ 原子切换路径与预约</text><text x="1530.0" y="911" text-anchor="middle" class="sub">保留完成历史及原始证据</text><rect x="195" y="825" width="360" height="110" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="375.0" y="868.0" text-anchor="middle" class="node">学生证据与活动记录</text><text x="375.0" y="898" text-anchor="middle" class="sub">observations / checkins</text><text x="375.0" y="919" text-anchor="middle" class="sub">mastery_snapshots</text><rect x="650" y="825" width="540" height="110" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="920.0" y="868.0" text-anchor="middle" class="node">历史路径与本次冻结依据</text><text x="920.0" y="898" text-anchor="middle" class="sub">paths.validation.learner_evidence</text><text x="920.0" y="919" text-anchor="middle" class="sub">agent_runs / agent_steps / reservations</text><polyline points="335,270 335,390" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="475,450 560,450 560,660 650,660" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="650,660 605,660 605,290 790,290 790,270" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="790,270 790,390" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="930,450 1035,450" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="1175,510 1175,610" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="1315,660 1335,660 1335,220 1360,220" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="1530,270 1530,390" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="1530,510 1530,825" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="335,510 335,825" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="1175,710 1175,825" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="1360,450 1340,450 1340,570 790,570 790,510" fill="none" stroke="#cc630d" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#o)"/><text x="1040" y="565" text-anchor="middle" class="small" style="fill:#cc630d">否：输入变化，重建预览</text><text x="1570" y="350" text-anchor="middle" class="small" style="fill:#17642c">仅接受</text><text x="1580" y="780" text-anchor="middle" class="small" style="fill:#17642c">校验通过</text><polyline points="1035,485 990,485 990,735 575,735 575,660 555,660" fill="none" stroke="#cc630d" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#o)"/><text x="1000" y="723" text-anchor="middle" class="small" style="fill:#cc630d">执行失败</text><rect x="195" y="610" width="360" height="100" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="375.0" y="648.0" text-anchor="middle" class="node">拒绝或失败：保留原路径</text><text x="375.0" y="686" text-anchor="middle" class="sub">候选不替换活动路径</text><polyline points="1530,170 1530,125 1750,125 1750,750 575,750 575,660 555,660" fill="none" stroke="#cc630d" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#o)"/><text x="790" y="358" text-anchor="middle" class="sub">预算变化 &gt;30%、图谱或技能范围变化 → 全局</text><text x="790" y="550" text-anchor="middle" class="sub">其他情况通常局部调整；已完成但薄弱 → 独立补强</text><text x="900" y="1026" text-anchor="middle" class="small">初测、路径测验及教师任务的有效证据参与现有规划；专业课程库证据桥接另见关系图。</text><text x="900" y="1057" text-anchor="middle" class="sub">绿色实线：已实现逻辑    橙色箭头：回退 / 调整    橙色虚线：待建设连接    ｜    依据当前源码与设计 · 2026-11-15</text></svg>