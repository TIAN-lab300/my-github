<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080"><defs><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="#17642c"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="#cc630d"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#17251d} .small{font-size:18px} .title{font-size:42px;font-weight:700} .node{font-size:23px;font-weight:600} .sub{font-size:17px;fill:#4a5d50}</style><rect width="1800" height="1080" fill="white"/><text x="900" y="62" text-anchor="middle" class="title">资源处理与入库流程</text><text x="900" y="102" text-anchor="middle" class="small">上传或登记链接 → 版本化 → 正文提取与复核 → 索引与知识点关联</text><rect x="25" y="140" width="1750" height="165" rx="18" fill="#f0f6f0"/><path d="M43 140 H155 V305 H43 Q25 305 25 287 V158 Q25 140 43 140" fill="#deedd8"/><text x="90" y="206.5" text-anchor="middle" class="node">用户</text><text x="90" y="238.5" text-anchor="middle" class="node">操作</text><rect x="25" y="330" width="1750" height="440" rx="18" fill="#f0f6f0"/><path d="M43 330 H155 V770 H43 Q25 770 25 752 V348 Q25 330 43 330" fill="#deedd8"/><text x="90" y="534.0" text-anchor="middle" class="node">系统</text><text x="90" y="566.0" text-anchor="middle" class="node">处理</text><rect x="25" y="795" width="1750" height="180" rx="18" fill="#f0f6f0"/><path d="M43 795 H155 V975 H43 Q25 975 25 957 V813 Q25 795 43 795" fill="#deedd8"/><text x="90" y="869.0" text-anchor="middle" class="node">数据</text><text x="90" y="901.0" text-anchor="middle" class="node">与审计</text><rect x="210" y="175" width="290" height="95" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="355.0" y="210.5" text-anchor="middle" class="node">① 上传或收藏资料</text><text x="355.0" y="246" text-anchor="middle" class="sub">学生个人 / 教师班级资料</text><rect x="1360" y="175" width="330" height="95" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="1525.0" y="210.5" text-anchor="middle" class="node">⑧ 查看与使用资料</text><text x="1525.0" y="246" text-anchor="middle" class="sub">权限范围内学习、检索与引用</text><rect x="210" y="390" width="290" height="115" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="355.0" y="435.5" text-anchor="middle" class="node">② 校验文件与权限</text><text x="355.0" y="481" text-anchor="middle" class="sub">格式 / 大小 / 所有权</text><rect x="610" y="390" width="290" height="115" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="755.0" y="435.5" text-anchor="middle" class="node">③ 保存资源版本</text><text x="755.0" y="481" text-anchor="middle" class="sub">附件存储 / 内容哈希</text><rect x="1010" y="390" width="290" height="115" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="1155.0" y="435.5" text-anchor="middle" class="node">④ 提取教学正文</text><text x="1155.0" y="481" text-anchor="middle" class="sub">文档解析 / OCR / 音视频</text><polygon points="1384,390 1666,390 1690,447.5 1666,505 1384,505 1360,447.5" fill="#fff2df" stroke="#cc630d" stroke-width="2"/><text x="1525.0" y="435.5" text-anchor="middle" class="node">⑤ 正文处理成功？</text><text x="1525.0" y="481" text-anchor="middle" class="sub">失败记录原因，不进入可用索引</text><rect x="1010" y="625" width="290" height="105" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="1155.0" y="665.5" text-anchor="middle" class="node">⑥ 确认提取内容</text><text x="1155.0" y="706" text-anchor="middle" class="sub">OCR / 转写结果需要复核</text><rect x="610" y="625" width="290" height="105" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="755.0" y="665.5" text-anchor="middle" class="node">⑦ 建立检索索引</text><text x="755.0" y="706" text-anchor="middle" class="sub">正文关键词 / 可选向量索引</text><rect x="210" y="625" width="290" height="105" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="355.0" y="665.5" text-anchor="middle" class="node">关联课程与知识点</text><text x="355.0" y="706" text-anchor="middle" class="sub">绑定具体正文版本</text><polyline points="355,270 355,390" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="500,447 610,447" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="900,447 1010,447" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="1300,447 1360,447" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="1525,505 1525,560 1155,560 1155,625" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="1010,677 900,677" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="610,677 500,677" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="355,625 355,535 1330,535 1330,290 1525,290 1525,270" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><text x="1440" y="550" text-anchor="middle" class="small" style="fill:#17642c">成功</text><polyline points="1690,447 1735,447 1735,350 1155,350 1155,390" fill="none" stroke="#cc630d" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#o)"/><text x="1450" y="344" text-anchor="middle" class="small" style="fill:#cc630d">失败：修正资料或重试</text><rect x="210" y="835" width="450" height="105" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="435.0" y="875.5" text-anchor="middle" class="node">资源与不可变版本</text><text x="435.0" y="916" text-anchor="middle" class="sub">resources / resource_versions / files</text><rect x="740" y="835" width="450" height="105" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="965.0" y="875.5" text-anchor="middle" class="node">处理任务与正文索引</text><text x="965.0" y="916" text-anchor="middle" class="sub">parse_jobs / transcripts / vector_chunks</text><rect x="1270" y="835" width="420" height="105" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="1480.0" y="875.5" text-anchor="middle" class="node">课程知识点与资料版本</text><text x="1480.0" y="916" text-anchor="middle" class="sub">learning_material_links</text><polyline points="755,505 755,550 550,550 550,790 435,790 435,835" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="755,730 755,790 965,790 965,835" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="355,730 355,770 1480,770 1480,835" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><text x="900" y="1000" text-anchor="middle" class="sub">网页收藏仅保存网址；授权抓取或导入后才处理正文。发布审核与云端发送授权分别控制。</text><text x="900" y="1026" text-anchor="middle" class="small">私有资料不自动公开；解析失败保留错误；向量服务未就绪时仍可使用关键词检索。</text><text x="900" y="1057" text-anchor="middle" class="sub">绿色实线：已实现逻辑    橙色箭头：回退 / 调整    ｜    依据当前源码与设计 · 2026-11-17</text></svg>