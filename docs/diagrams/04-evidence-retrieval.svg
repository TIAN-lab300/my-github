<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080"><defs><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="#17642c"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="#cc630d"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#17251d} .small{font-size:18px} .title{font-size:42px;font-weight:700} .node{font-size:23px;font-weight:600} .sub{font-size:17px;fill:#4a5d50}</style><rect width="1800" height="1080" fill="white"/><text x="900" y="62" text-anchor="middle" class="title">证据检索与来源核验流程</text><text x="900" y="102" text-anchor="middle" class="small">权限限定可见范围 → 检索正文 → 核验覆盖 → 返回引用或补充来源</text><rect x="25" y="140" width="1750" height="165" rx="18" fill="#f0f6f0"/><path d="M43 140 H155 V305 H43 Q25 305 25 287 V158 Q25 140 43 140" fill="#deedd8"/><text x="90" y="206.5" text-anchor="middle" class="node">用户</text><text x="90" y="238.5" text-anchor="middle" class="node">操作</text><rect x="25" y="330" width="1750" height="440" rx="18" fill="#f0f6f0"/><path d="M43 330 H155 V770 H43 Q25 770 25 752 V348 Q25 330 43 330" fill="#deedd8"/><text x="90" y="534.0" text-anchor="middle" class="node">系统</text><text x="90" y="566.0" text-anchor="middle" class="node">处理</text><rect x="25" y="795" width="1750" height="180" rx="18" fill="#f0f6f0"/><path d="M43 795 H155 V975 H43 Q25 975 25 957 V813 Q25 795 43 795" fill="#deedd8"/><text x="90" y="869.0" text-anchor="middle" class="node">数据</text><text x="90" y="901.0" text-anchor="middle" class="node">与审计</text><rect x="210" y="175" width="290" height="95" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="355.0" y="210.5" text-anchor="middle" class="node">① 输入检索需求</text><text x="355.0" y="246" text-anchor="middle" class="sub">关键词 / 知识点 / 资料范围</text><rect x="1360" y="175" width="330" height="95" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="1525.0" y="210.5" text-anchor="middle" class="node">⑦ 查看证据与缺口</text><text x="1525.0" y="246" text-anchor="middle" class="sub">正文引用与课程入口分开展示</text><rect x="210" y="390" width="290" height="115" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="355.0" y="435.5" text-anchor="middle" class="node">② 校验身份与权限</text><text x="355.0" y="481" text-anchor="middle" class="sub">本人私有 / 班级 / 校级</text><rect x="610" y="390" width="290" height="115" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="755.0" y="435.5" text-anchor="middle" class="node">③ 检索可用正文</text><text x="755.0" y="481" text-anchor="middle" class="sub">关键词 + 已就绪向量索引</text><polygon points="1034,390 1276,390 1300,447.5 1276,505 1034,505 1010,447.5" fill="#fff2df" stroke="#cc630d" stroke-width="2"/><text x="1155.0" y="435.5" text-anchor="middle" class="node">④ 覆盖目标技能？</text><text x="1155.0" y="481" text-anchor="middle" class="sub">核验版本、来源与相关性</text><rect x="210" y="625" width="290" height="105" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="355.0" y="665.5" text-anchor="middle" class="node">⑥ 请求外部搜索</text><text x="355.0" y="706" text-anchor="middle" class="sub">须用户允许且服务已配置</text><rect x="610" y="625" width="290" height="105" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="755.0" y="665.5" text-anchor="middle" class="node">核对搜索来源</text><text x="755.0" y="706" text-anchor="middle" class="sub">真实供应商 / 安全网址</text><rect x="1010" y="625" width="290" height="105" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="1155.0" y="665.5" text-anchor="middle" class="node">⑤ 返回本地结果</text><text x="1155.0" y="706" text-anchor="middle" class="sub">保留缺口，避免虚构证据</text><rect x="1360" y="625" width="330" height="105" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="1525.0" y="665.5" text-anchor="middle" class="node">⑧ 收藏或授权导入</text><text x="1525.0" y="706" text-anchor="middle" class="sub">个人收藏 / 教师导入后审核</text><polyline points="355,270 355,390" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="500,447 610,447" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="900,447 1010,447" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="1300,447 1525,447 1525,270" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="1155,505 1155,625" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><text x="1390" y="430" text-anchor="middle" class="small" style="fill:#17642c">充足</text><text x="1200" y="570" text-anchor="middle" class="small" style="fill:#cc630d">不足</text><polyline points="1010,677 950,677 950,580 355,580 355,625" fill="none" stroke="#cc630d" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#o)"/><text x="700" y="572" text-anchor="middle" class="small" style="fill:#cc630d">需要补充且允许联网</text><polyline points="500,677 610,677" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="900,677 950,677 950,750 1525,750 1525,730" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="1300,677 1325,677 1325,290 1525,290 1525,270" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><rect x="210" y="835" width="450" height="105" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="435.0" y="875.5" text-anchor="middle" class="node">正文与索引</text><text x="435.0" y="916" text-anchor="middle" class="sub">resource_versions / chunks / vector_chunks</text><rect x="740" y="835" width="450" height="105" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="965.0" y="875.5" text-anchor="middle" class="node">检索记录与来源核验</text><text x="965.0" y="916" text-anchor="middle" class="sub">search_runs / audit_logs</text><rect x="1270" y="835" width="420" height="105" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="1480.0" y="875.5" text-anchor="middle" class="node">资料补齐后再次检索</text><text x="1480.0" y="916" text-anchor="middle" class="sub">导入正文 → 审核 → 建立索引</text><polyline points="355,505 180,505 180,885 210,885" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="755,730 755,835" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="1525,730 1715,730 1715,885 1690,885" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><text x="900" y="1000" text-anchor="middle" class="sub">未配置实时搜索：明确提示并提供手动搜索入口；网址收藏不等于可引用正文。</text><text x="900" y="1026" text-anchor="middle" class="small">检索遵守资料权限；课程目录与课程链接只提供入口，不能冒充已经导入的正文证据。</text><text x="900" y="1057" text-anchor="middle" class="sub">绿色实线：已实现逻辑    橙色箭头：回退 / 调整    ｜    依据当前源码与设计 · 2026-11-17</text></svg>