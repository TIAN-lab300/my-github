<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080"><defs><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="#17642c"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="#cc630d"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#17251d} .small{font-size:18px} .title{font-size:42px;font-weight:700} .node{font-size:23px;font-weight:600} .sub{font-size:17px;fill:#4a5d50}</style><rect width="1800" height="1080" fill="white"/><text x="900" y="62" text-anchor="middle" class="title">学习画像快照与恢复流程</text><text x="900" y="102" text-anchor="middle" class="small">确定性聚合 → 水位去重与版本化 → 历史留存 → 刷新失败时回显有效快照</text><rect x="25" y="140" width="1750" height="165" rx="18" fill="#f0f6f0"/><path d="M43 140 H155 V305 H43 Q25 305 25 287 V158 Q25 140 43 140" fill="#deedd8"/><text x="90" y="206.5" text-anchor="middle" class="node">用户</text><text x="90" y="238.5" text-anchor="middle" class="node">操作</text><rect x="25" y="330" width="1750" height="440" rx="18" fill="#f0f6f0"/><path d="M43 330 H155 V770 H43 Q25 770 25 752 V348 Q25 330 43 330" fill="#deedd8"/><text x="90" y="534.0" text-anchor="middle" class="node">系统</text><text x="90" y="566.0" text-anchor="middle" class="node">处理</text><rect x="25" y="795" width="1750" height="180" rx="18" fill="#f0f6f0"/><path d="M43 795 H155 V975 H43 Q25 975 25 957 V813 Q25 795 43 795" fill="#deedd8"/><text x="90" y="869.0" text-anchor="middle" class="node">数据</text><text x="90" y="901.0" text-anchor="middle" class="node">与审计</text><rect x="210" y="175" width="290" height="95" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="355.0" y="210.5" text-anchor="middle" class="node">① 查看或刷新画像</text><text x="355.0" y="246" text-anchor="middle" class="sub">学生本人 / 教师本班授权投影</text><rect x="1360" y="175" width="330" height="95" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="1525.0" y="210.5" text-anchor="middle" class="node">⑧ 展示画像与质量</text><text x="1525.0" y="246" text-anchor="middle" class="sub">版本、生成时间、统计窗口、状态</text><rect x="210" y="390" width="290" height="115" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="355.0" y="435.5" text-anchor="middle" class="node">② 校验身份与范围</text><text x="355.0" y="481" text-anchor="middle" class="sub">教师仅访问本班授权数据</text><rect x="610" y="390" width="290" height="115" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="755.0" y="435.5" text-anchor="middle" class="node">③ 聚合真实学习事实</text><text x="755.0" y="481" text-anchor="middle" class="sub">行为 / 任务 / 有效证据 / 掌握度</text><polygon points="1034,390 1276,390 1300,447.5 1276,505 1034,505 1010,447.5" fill="#fff2df" stroke="#cc630d" stroke-width="2"/><text x="1155.0" y="435.5" text-anchor="middle" class="node">④ 本次刷新成功？</text><text x="1155.0" y="481" text-anchor="middle" class="sub">数值由业务服务计算</text><rect x="1360" y="390" width="330" height="115" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="1525.0" y="435.5" text-anchor="middle" class="node">⑤ 比较数据水位与内容</text><text x="1525.0" y="481" text-anchor="middle" class="sub">相同则复用；变化则生成新版本</text><rect x="210" y="625" width="290" height="105" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="355.0" y="665.5" text-anchor="middle" class="node">⑦ 标记过期并回显</text><text x="355.0" y="706" text-anchor="middle" class="sub">显示上一有效版本及刷新错误</text><polygon points="634,625 876,625 900,677.5 876,730 634,730 610,677.5" fill="#fff2df" stroke="#cc630d" stroke-width="2"/><text x="755.0" y="665.5" text-anchor="middle" class="node">⑥ 存在历史快照？</text><text x="755.0" y="706" text-anchor="middle" class="sub">刷新失败后查询最近有效版本</text><rect x="1010" y="625" width="290" height="105" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="1155.0" y="665.5" text-anchor="middle" class="node">暂无画像：提示重试</text><text x="1155.0" y="706" text-anchor="middle" class="sub">无历史时返回不可用，不编造数值</text><rect x="1360" y="625" width="330" height="105" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="1525.0" y="665.5" text-anchor="middle" class="node">保存快照与处理状态</text><text x="1525.0" y="706" text-anchor="middle" class="sub">学生刷新事件记录关联快照</text><polyline points="355,270 355,390" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="500,447 610,447" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="900,447 1010,447" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="1300,447 1360,447" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="1525,505 1525,625" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="1690,677 1735,677 1735,290 1525,290 1525,270" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="610,677 500,677" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="355,625 355,550 1330,550 1330,290 1525,290 1525,270" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><text x="1330" y="430" text-anchor="middle" class="small" style="fill:#17642c">成功</text><text x="550" y="660" text-anchor="middle" class="small" style="fill:#17642c">有</text><polyline points="1155,505 1155,575 755,575 755,625" fill="none" stroke="#cc630d" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#o)"/><text x="950" y="567" text-anchor="middle" class="small" style="fill:#cc630d">失败：保留刷新错误</text><polyline points="900,677 1010,677" fill="none" stroke="#cc630d" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#o)"/><text x="955" y="660" text-anchor="middle" class="small" style="fill:#cc630d">无</text><polyline points="1155,730 1155,765 180,765 180,350 355,350 355,390" fill="none" stroke="#cc630d" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#o)"/><text x="700" y="755" text-anchor="middle" class="small" style="fill:#cc630d">用户重试或后台刷新</text><rect x="210" y="835" width="450" height="105" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="435.0" y="875.5" text-anchor="middle" class="node">事实来源：仅按权限聚合</text><text x="435.0" y="903" text-anchor="middle" class="sub">goals / attempts / observations</text><text x="435.0" y="924" text-anchor="middle" class="sub">study_sessions / assignments / checkins</text><rect x="740" y="835" width="450" height="105" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="965.0" y="875.5" text-anchor="middle" class="node">不可变画像历史</text><text x="965.0" y="903" text-anchor="middle" class="sub">profile_snapshots</text><text x="965.0" y="924" text-anchor="middle" class="sub">scope / watermark / version / payload</text><rect x="1270" y="835" width="420" height="105" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="1480.0" y="875.5" text-anchor="middle" class="node">刷新事件与失败信息</text><text x="1480.0" y="903" text-anchor="middle" class="sub">profile_refresh_events</text><text x="1480.0" y="924" text-anchor="middle" class="sub">pending / processed / failed</text><polyline points="435,835 435,790 550,790 550,350 755,350 755,390" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="1525,730 1525,790 965,790 965,835" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="1690,677 1710,677 1710,790 1480,790 1480,835" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><text x="900" y="1000" text-anchor="middle" class="sub">历史回显重新遵守当前权限；刷新失败的旧快照必须标记 stale，不冒充最新画像。</text><text x="900" y="1026" text-anchor="middle" class="small">“恢复”指失败回退展示与历史查看，不回滚成绩、掌握证据或学习记录；学习分钟不直接提高掌握度。</text><text x="900" y="1057" text-anchor="middle" class="sub">绿色实线：已实现逻辑    橙色箭头：回退 / 调整    ｜    依据当前源码与设计 · 2026-11-17</text></svg>