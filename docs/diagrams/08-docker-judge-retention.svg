<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080"><defs><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="#17642c"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="#cc630d"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#17251d} .small{font-size:18px} .title{font-size:42px;font-weight:700} .node{font-size:23px;font-weight:600} .sub{font-size:17px;fill:#4a5d50}</style><rect width="1800" height="1080" fill="white"/><text x="900" y="62" text-anchor="middle" class="title">Docker 判题适配与结果留存流程</text><text x="900" y="102" text-anchor="middle" class="small">Python 代码提交 → 隔离逐例运行 → 任务状态复核 → 事务保存结果</text><rect x="25" y="140" width="1750" height="165" rx="18" fill="#f0f6f0"/><path d="M43 140 H155 V305 H43 Q25 305 25 287 V158 Q25 140 43 140" fill="#deedd8"/><text x="90" y="206.5" text-anchor="middle" class="node">用户</text><text x="90" y="238.5" text-anchor="middle" class="node">操作</text><rect x="25" y="330" width="1750" height="440" rx="18" fill="#f0f6f0"/><path d="M43 330 H155 V770 H43 Q25 770 25 752 V348 Q25 330 43 330" fill="#deedd8"/><text x="90" y="534.0" text-anchor="middle" class="node">系统</text><text x="90" y="566.0" text-anchor="middle" class="node">处理</text><rect x="25" y="795" width="1750" height="180" rx="18" fill="#f0f6f0"/><path d="M43 795 H155 V975 H43 Q25 975 25 957 V813 Q25 795 43 795" fill="#deedd8"/><text x="90" y="869.0" text-anchor="middle" class="node">数据</text><text x="90" y="901.0" text-anchor="middle" class="node">与审计</text><rect x="210" y="175" width="290" height="95" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="355.0" y="210.5" text-anchor="middle" class="node">① 提交 Python 程序</text><text x="355.0" y="246" text-anchor="middle" class="sub">教师编程任务 / 代码与用时</text><rect x="1360" y="175" width="330" height="95" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="1525.0" y="210.5" text-anchor="middle" class="node">⑨ 查看判分与反馈</text><text x="1525.0" y="246" text-anchor="middle" class="sub">逐例状态、是否通过、总分</text><rect x="210" y="390" width="290" height="115" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="355.0" y="435.5" text-anchor="middle" class="node">② 校验任务与提交</text><text x="355.0" y="481" text-anchor="middle" class="sub">成员权限 / 发布状态 / 测试用例</text><rect x="610" y="390" width="290" height="115" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="755.0" y="435.5" text-anchor="middle" class="node">③ 幂等检查并领取租约</text><text x="755.0" y="481" text-anchor="middle" class="sub">已交卷返回原结果；运行中拒绝重复</text><polygon points="1034,390 1276,390 1300,447.5 1276,505 1034,505 1010,447.5" fill="#fff2df" stroke="#cc630d" stroke-width="2"/><text x="1155.0" y="435.5" text-anchor="middle" class="node">④ Docker 环境可用？</text><text x="1155.0" y="481" text-anchor="middle" class="sub">Docker 服务 + 本地预置镜像</text><rect x="1360" y="390" width="330" height="115" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="1525.0" y="435.5" text-anchor="middle" class="node">⑤ 逐用例隔离执行</text><text x="1525.0" y="481" text-anchor="middle" class="sub">非 root / 禁网 / 只读 / 限制资源</text><rect x="210" y="625" width="290" height="105" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="355.0" y="665.5" text-anchor="middle" class="node">⑧ 原子保存判题结果</text><text x="355.0" y="706" text-anchor="middle" class="sub">通过数 / 用例数；完成任务与预约</text><polygon points="634,625 876,625 900,677.5 876,730 634,730 610,677.5" fill="#fff2df" stroke="#cc630d" stroke-width="2"/><text x="755.0" y="665.5" text-anchor="middle" class="node">⑦ 提交前状态仍有效？</text><text x="755.0" y="706" text-anchor="middle" class="sub">租约令牌 / 任务版本 / 成员权限</text><rect x="1010" y="625" width="290" height="105" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="1155.0" y="665.5" text-anchor="middle" class="node">⑥ 汇总用例结果</text><text x="1155.0" y="706" text-anchor="middle" class="sub">通过 / 答案错误 / 异常 / 超限</text><rect x="1360" y="625" width="330" height="105" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="1525.0" y="665.5" text-anchor="middle" class="node">隔离执行限制</text><text x="1525.0" y="693" text-anchor="middle" class="sub">每例 5 秒 / 输出 64 KiB</text><text x="1525.0" y="714" text-anchor="middle" class="sub">内存 128 MiB / CPU 0.5 / PID 32</text><polyline points="355,270 355,390" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="500,447 610,447" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="900,447 1010,447" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="1300,447 1360,447" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="1525,505 1525,625" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="1360,677 1300,677" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="1010,677 900,677" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="610,677 500,677" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="355,625 355,550 1330,550 1330,290 1525,290 1525,270" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><text x="1330" y="430" text-anchor="middle" class="small" style="fill:#17642c">是</text><text x="550" y="660" text-anchor="middle" class="small" style="fill:#17642c">有效</text><polyline points="1155,390 1155,350 1730,350 1730,885 1690,885" fill="none" stroke="#cc630d" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#o)"/><text x="1460" y="344" text-anchor="middle" class="small" style="fill:#cc630d">环境不可用：明确失败，不在宿主执行</text><polyline points="755,730 755,770 1480,770 1480,835" fill="none" stroke="#cc630d" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#o)"/><text x="1120" y="760" text-anchor="middle" class="small" style="fill:#cc630d">状态变化：拒绝写入，记录失败</text><rect x="210" y="835" width="450" height="105" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="435.0" y="875.5" text-anchor="middle" class="node">提交与评分结果</text><text x="435.0" y="903" text-anchor="middle" class="sub">attempts：代码、分数、逐例反馈</text><text x="435.0" y="924" text-anchor="middle" class="sub">用时、迟交标记、提交时间</text><rect x="740" y="835" width="450" height="105" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="965.0" y="875.5" text-anchor="middle" class="node">任务与排期状态</text><text x="965.0" y="903" text-anchor="middle" class="sub">assignments / reservations</text><text x="965.0" y="924" text-anchor="middle" class="sub">完成状态 + 用户数据水位更新</text><rect x="1270" y="835" width="420" height="105" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="1480.0" y="875.5" text-anchor="middle" class="node">判题租约与执行状态</text><text x="1480.0" y="903" text-anchor="middle" class="sub">code_runs：token / lease_until</text><text x="1480.0" y="924" text-anchor="middle" class="sub">running → ready 或 failed</text><polyline points="355,730 355,835" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="500,700 550,700 550,790 965,790 965,835" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><text x="900" y="1000" text-anchor="middle" class="sub">超时或输出超限终止容器；结束后清理。仅保存逐例状态与通过标记，不保存完整标准输出。</text><text x="900" y="1026" text-anchor="middle" class="small">当前为 Python Docker 适配；真实容器验收仍待环境验证。环境失败可重试，已评分提交返回原结果。</text><text x="900" y="1057" text-anchor="middle" class="sub">绿色实线：已实现逻辑    橙色箭头：回退 / 调整    ｜    依据当前源码与设计 · 2026-11-17</text></svg>