<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080"><defs><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="#17642c"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="#cc630d"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#17251d} .small{font-size:18px} .title{font-size:42px;font-weight:700} .node{font-size:23px;font-weight:600} .sub{font-size:17px;fill:#4a5d50}</style><rect width="1800" height="1080" fill="white"/><text x="900" y="62" text-anchor="middle" class="title">智能规划职责与编排流程</text><text x="900" y="102" text-anchor="middle" class="small">服务端维护事实与硬规则 → 四智能体协作 → 候选预览 → 确认后激活</text><rect x="25" y="140" width="1750" height="165" rx="18" fill="#f0f6f0"/><path d="M43 140 H155 V305 H43 Q25 305 25 287 V158 Q25 140 43 140" fill="#deedd8"/><text x="90" y="206.5" text-anchor="middle" class="node">用户</text><text x="90" y="238.5" text-anchor="middle" class="node">操作</text><rect x="25" y="330" width="1750" height="440" rx="18" fill="#f0f6f0"/><path d="M43 330 H155 V770 H43 Q25 770 25 752 V348 Q25 330 43 330" fill="#deedd8"/><text x="90" y="534.0" text-anchor="middle" class="node">系统</text><text x="90" y="566.0" text-anchor="middle" class="node">处理</text><rect x="25" y="795" width="1750" height="180" rx="18" fill="#f0f6f0"/><path d="M43 795 H155 V975 H43 Q25 975 25 957 V813 Q25 795 43 795" fill="#deedd8"/><text x="90" y="869.0" text-anchor="middle" class="node">数据</text><text x="90" y="901.0" text-anchor="middle" class="node">与审计</text><rect x="210" y="175" width="290" height="95" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="355.0" y="210.5" text-anchor="middle" class="node">① 确认目标与预算</text><text x="355.0" y="246" text-anchor="middle" class="sub">交卷后启动 / 主动重规划</text><rect x="1360" y="175" width="330" height="95" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="1525.0" y="210.5" text-anchor="middle" class="node">⑦ 查看候选并决定</text><text x="1525.0" y="246" text-anchor="middle" class="sub">接受 / 暂不接受；显示差异与引用</text><rect x="210" y="390" width="290" height="115" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="355.0" y="435.5" text-anchor="middle" class="node">② 诊断智能体</text><text x="355.0" y="481" text-anchor="middle" class="sub">读取目标、真实作答与掌握证据</text><rect x="610" y="390" width="290" height="115" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="755.0" y="435.5" text-anchor="middle" class="node">③ 路径构建智能体</text><text x="755.0" y="481" text-anchor="middle" class="sub">安排先修、活动、资料与分钟</text><polygon points="1034,390 1276,390 1300,447.5 1276,505 1034,505 1010,447.5" fill="#fff2df" stroke="#cc630d" stroke-width="2"/><text x="1155.0" y="435.5" text-anchor="middle" class="node">④ 审查是否通过？</text><text x="1155.0" y="481" text-anchor="middle" class="sub">教学一致性 + 服务端硬规则</text><rect x="1360" y="390" width="330" height="115" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="1525.0" y="435.5" text-anchor="middle" class="node">⑤ 重规划智能体</text><text x="1525.0" y="481" text-anchor="middle" class="sub">解释风险、差异与调整建议</text><rect x="1010" y="625" width="290" height="105" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="1155.0" y="665.5" text-anchor="middle" class="node">修复活动并重新审查</text><text x="1155.0" y="706" text-anchor="middle" class="sub">云端最多修复 3 次；耗尽则失败</text><rect x="1360" y="625" width="330" height="105" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="1525.0" y="665.5" text-anchor="middle" class="node">⑥ 保存候选与运行过程</text><text x="1525.0" y="706" text-anchor="middle" class="sub">冻结输入 / 引用 / 步骤记录</text><polygon points="634,625 876,625 900,677.5 876,730 634,730 610,677.5" fill="#fff2df" stroke="#cc630d" stroke-width="2"/><text x="755.0" y="665.5" text-anchor="middle" class="node">⑧ 接受前再次校验</text><text x="755.0" y="706" text-anchor="middle" class="sub">版本 / 权限 / 时间预算一致？</text><rect x="210" y="625" width="290" height="105" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="355.0" y="665.5" text-anchor="middle" class="node">⑨ 原子激活新路径</text><text x="355.0" y="706" text-anchor="middle" class="sub">切换路径与预约，保留历史</text><polyline points="355,270 355,390" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="500,447 610,447" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="900,447 1010,447" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="1300,447 1360,447" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="1525,505 1525,625" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="1690,677 1735,677 1735,290 1525,290 1525,270" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="1360,220 950,220 950,580 755,580 755,625" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="610,677 500,677" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><text x="1330" y="430" text-anchor="middle" class="small" style="fill:#17642c">通过</text><text x="1000" y="208" text-anchor="middle" class="small" style="fill:#17642c">仅接受后</text><text x="550" y="660" text-anchor="middle" class="small" style="fill:#17642c">一致</text><polyline points="1155,505 1155,625" fill="none" stroke="#cc630d" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#o)"/><text x="1210" y="565" text-anchor="middle" class="small" style="fill:#cc630d">不通过</text><polyline points="1010,677 930,677 930,535 755,535 755,505" fill="none" stroke="#cc630d" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#o)"/><text x="800" y="528" text-anchor="middle" class="small" style="fill:#cc630d">重建</text><polyline points="755,730 755,770 180,770 180,350 355,350 355,390" fill="none" stroke="#cc630d" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#o)"/><text x="470" y="762" text-anchor="middle" class="small" style="fill:#cc630d">输入变化：重新生成预览</text><rect x="210" y="835" width="450" height="105" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="435.0" y="875.5" text-anchor="middle" class="node">事实与约束：服务端维护</text><text x="435.0" y="916" text-anchor="middle" class="sub">判分 / BKT / 诊断 / 图谱 / 预算</text><rect x="740" y="835" width="450" height="105" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="965.0" y="875.5" text-anchor="middle" class="node">运行与候选：全程可追踪</text><text x="965.0" y="916" text-anchor="middle" class="sub">agent_runs / agent_steps / paths</text><rect x="1270" y="835" width="420" height="105" rx="12" fill="#ffffff" stroke="#17642c" stroke-width="2"/><text x="1480.0" y="875.5" text-anchor="middle" class="node">激活与预约：事务提交</text><text x="1480.0" y="916" text-anchor="middle" class="sub">paths / reservations / 完成历史</text><polyline points="435,835 435,790 180,790 180,447 210,447" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="1525,730 1525,790 965,790 965,835" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><polyline points="355,730 355,785 1730,785 1730,885 1690,885" fill="none" stroke="#17642c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#g)"/><text x="900" y="1000" text-anchor="middle" class="sub">本地或已配置云端模式；缺正文、预算不足、审查失败或用户拒绝：保留原路径，不激活候选。</text><text x="900" y="1026" text-anchor="middle" class="small">模型不改写分数、BKT与完成历史；系统重规划只生成候选，必须由学生确认后生效。</text><text x="900" y="1057" text-anchor="middle" class="sub">绿色实线：已实现逻辑    橙色箭头：回退 / 调整    ｜    依据当前源码与设计 · 2026-11-17</text></svg>